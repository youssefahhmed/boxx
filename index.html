<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Your Box ❤️</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ff9fba, #ff6f91, #ffc1d6);
    position: relative;
    padding: 40px 20px;
    text-align: center;
  }

  .hint {
    color: #650019;
    font-size: 20px;
    margin-bottom: 40px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .hint.hidden {
    display: none;
  }

  /* ===== GIFT BOX ===== */
  .gift-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    cursor: pointer;
  }

  .gift-wrap.opened {
    cursor: default;
  }

  .gift-wrap.away {
    display: none;
  }

  .box-body {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 220px;
    height: 140px;
    background: linear-gradient(135deg, #e63965, #ff6f91);
    border-radius: 10px;
    box-shadow: 0 15px 35px rgba(120, 0, 40, 0.35);
  }

  .gift-wrap.shake .box-body {
    animation: shake 0.5s ease;
  }

  .box-ribbon-v {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 140px;
    background: #ffe3ec;
    z-index: 2;
  }

  .box-lid {
    position: absolute;
    bottom: 140px;
    left: -10px;
    width: 240px;
    height: 50px;
    background: linear-gradient(135deg, #ff85a1, #ff6f91);
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(120, 0, 40, 0.3);
    z-index: 3;
    transform-origin: bottom center;
    transition: transform 1s cubic-bezier(.68,-0.55,.27,1.55), opacity 0.8s ease;
  }

  .box-lid-ribbon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 50px;
    background: #ffe3ec;
  }

  .bow {
    position: absolute;
    bottom: 175px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 46px;
    z-index: 4;
    transition: transform 1s cubic-bezier(.68,-0.55,.27,1.55), opacity 0.8s ease;
  }

  .gift-wrap.opened .box-lid {
    transform: translateY(-160px) rotate(-25deg);
    opacity: 0;
  }

  .gift-wrap.opened .bow {
    transform: translate(-50%, -220px) rotate(35deg);
    opacity: 0;
  }

  .glow {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
    z-index: 1;
    transition: transform 0.6s ease;
  }

  .gift-wrap.opened .glow {
    transform: translateX(-50%) scale(1.3);
  }

  /* ===== SCRATCH CARD ===== */
  .scratch-wrap {
    position: relative;
    margin-top: 20px;
    width: 90%;
    max-width: 600px;
    min-height: 280px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(120, 0, 40, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.6);
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .scratch-wrap.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .message-card {
    position: absolute;
    inset: 0;
    padding: 40px 30px;
    text-align: center;
    background: rgba(255, 111, 145, 0.45);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .message-card h1 {
    color: #8b001f;
    font-size: 32px;
    margin-bottom: 20px;
  }

  .message-card p {
    color: #650019;
    font-size: 20px;
    line-height: 1.7;
  }

  .main-heart {
    font-size: 44px;
    margin-top: 20px;
  }

  .scratch-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity 0.6s ease;
  }

  .scratch-canvas.done {
    opacity: 0;
    pointer-events: none;
  }

  .scratch-tip {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 15px;
    z-index: 6;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    pointer-events: none;
  }

  /* ===== FLOATING HEARTS ON OPEN ===== */
  .burst-heart {
    position: fixed;
    bottom: 40%;
    font-size: 26px;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }

  .burst-heart.fly {
    animation: burst 1.6s ease-out forwards;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }

  @keyframes burst {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(0.6);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(360deg);
    }
  }

  @media (max-width: 600px) {
    .message-card h1 { font-size: 24px; }
    .message-card p { font-size: 16px; }
    .gift-wrap { width: 180px; height: 180px; }
    .box-body { width: 180px; height: 115px; }
    .box-lid { width: 200px; left: -10px; bottom: 115px; }
    .bow { bottom: 150px; font-size: 38px; }
    .scratch-wrap { min-height: 240px; }
  }
</style>
</head>
<body>

  <p class="hint" id="hint">Tap the gift to open it 🎁</p>

  <div class="gift-wrap" id="giftWrap">
    <div class="glow"></div>
    <div class="box-body"></div>
    <div class="box-ribbon-v"></div>
    <div class="box-lid">
      <div class="box-lid-ribbon"></div>
    </div>
    <div class="bow">🎀</div>
  </div>

  <div class="scratch-wrap" id="scratchWrap">
    <div class="message-card">
      <h1>To My Favorite Person ❤️</h1>
      <p>
        Write whatever you want here...
        <br>
        This little surprise was made just for you 🌹
      </p>
      <div class="main-heart">❤️</div>
    </div>
    <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
    <div class="scratch-tip" id="scratchTip">Scratch to reveal ✨</div>
  </div>

  <script>
    let opened = false;

    const giftWrapEl = document.getElementById('giftWrap');
    let touchFired = false;

    giftWrapEl.addEventListener('touchstart', function (e) {
      touchFired = true;
      openGift();
    }, { passive: true });

    giftWrapEl.addEventListener('click', function (e) {
      if (touchFired) {
        // Ignore the synthetic click that follows a touch, already handled above.
        touchFired = false;
        return;
      }
      openGift();
    });

    function openGift() {
      if (opened) return;
      opened = true;

      const wrap = document.getElementById('giftWrap');
      const hint = document.getElementById('hint');
      const scratchWrap = document.getElementById('scratchWrap');

      wrap.classList.add('shake');

      setTimeout(() => {
        wrap.classList.remove('shake');
        wrap.classList.add('opened');
        hint.classList.add('hidden');
        spawnHearts();

        setTimeout(() => {
          wrap.classList.add('away');
          scratchWrap.classList.add('show');
          setupScratchCard();
        }, 500);
      }, 400);
    }

    function spawnHearts() {
      const colors = ['❤️', '💖', '💕', '🌹'];
      for (let i = 0; i < 14; i++) {
        const h = document.createElement('div');
        h.className = 'burst-heart';
        h.textContent = colors[Math.floor(Math.random() * colors.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 150;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 100;

        h.style.setProperty('--dx', dx + 'px');
        h.style.setProperty('--dy', dy + 'px');
        h.style.left = '50%';

        document.body.appendChild(h);
        requestAnimationFrame(() => h.classList.add('fly'));

        setTimeout(() => h.remove(), 1700);
      }
    }

    function setupScratchCard() {
      const canvas = document.getElementById('scratchCanvas');
      const wrap = document.getElementById('scratchWrap');
      const tip = document.getElementById('scratchTip');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        drawSurface();
      }

      function drawSurface() {
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#e6748f');
        grad.addColorStop(1, '#ff9fba');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = 'bold 22px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎁  Scratch me  🎁', canvas.width / 2, canvas.height / 2);
      }

      resize();
      window.addEventListener('resize', resize);

      let drawing = false;
      let revealed = false;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;
        return {
          x: point.clientX - rect.left,
          y: point.clientY - rect.top
        };
      }

      function scratch(e) {
        if (revealed) return;
        const pos = getPos(e);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 28, 0, Math.PI * 2);
        ctx.fill();
        checkProgress();
      }

      function checkProgress() {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let cleared = 0;
        const step = 20;
        let total = 0;
        for (let i = 3; i < data.length; i += 4 * step) {
          total++;
          if (data[i] === 0) cleared++;
        }
        if (cleared / total > 0.45 && !revealed) {
          revealed = true;
          canvas.classList.add('done');
          tip.style.display = 'none';
        }
      }

      function start(e) {
        drawing = true;
        tip.style.opacity = '0';
        scratch(e);
      }
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        scratch(e);
      }
      function end() {
        drawing = false;
      }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);

      canvas.addEventListener('touchstart', start, { passive: true });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
    }
  </script>

</body>
</html>
